name: Generar APK de prueba
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true
      - name: Crear Android e iOS y resolver dependencias
        run: dart tool/setup.dart
      - name: Analizar
        run: flutter analyze --no-fatal-infos
      - name: Pruebas Flutter
        run: flutter test
      - name: Conexión Dart con servidor Node
        run: flutter test test/connection_test.dart
        env:
          SYNCHRONY_INTEGRATION: '1'
      - name: Compilar APK de prueba
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: Synchrony-APK-prueba
          path: build/app/outputs/flutter-apk/app-debug.apk
